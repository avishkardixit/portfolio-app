<section id="experience">
  <h2 class="section-title"><span>02.</span> Experience</h2>

  <div class="experience-wrapper">
    <!-- Left Tabs -->
    <div class="company-tabs">
      <button
        *ngFor="let exp of experiences; let i = index"
        (click)="selected = i"
        [class.active]="selected === i">
        {{ exp.company }}
      </button>
    </div>

    <!-- Right Content -->
    <div class="experience-content">
      <div *ngFor="let role of experiences[selected].roles" class="role">
        <h3>
          {{ role.title }}
          <span class="company">&#64; {{ experiences[selected].company }}</span>
        </h3>

        <p class="time">{{ role.time }}</p>

        <ul>
          <li *ngFor="let point of role.points">
            ▹ {{ point }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
